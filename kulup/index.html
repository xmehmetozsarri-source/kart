<style>
/* Layout: one 9:19.5 phone stage (the TikTok screen) with a compact control deck under it. Single dark neon look by choice. */
:root{

  --pink:#ff3ea5; --cyan:#29e3ff; --gold:#ffc83d; --lime:#7dff5c;
  --disp:"Bungee","Impact",sans-serif; --body:"Rubik",system-ui,Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;
  display:flex;flex-direction:column;align-items:center;gap:14px}
.phone{position:relative;flex-shrink:0;width:min(100%,400px,calc((100dvh - 32px)*9/19.5));max-width:100%;aspect-ratio:9/19.5;border-radius:28px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line),0 24px 70px #000}
#c{width:100%;height:100%;display:block}
.deck{width:min(100%,400px);display:grid;gap:10px}
.deck h2{font:400 15px var(--disp);letter-spacing:.06em;margin:4px 0 0;color:var(--cyan)}
.deck p{margin:0;color:var(--mute);font-size:13.5px;line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:8px}
.deck input[type=text]{flex:1;min-width:0;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:500 15px var(--body)}
.deck button{flex:1 1 calc(50% - 8px);padding:10px 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:700 14px var(--body);cursor:pointer}
.deck button b{display:block;font-size:11.5px;font-weight:500;color:var(--mute);margin-top:2px}
.deck button:hover{border-color:var(--cyan)}
.deck button.sec{border-color:var(--pink);background:var(--pink);color:#fff}
.deck button:focus-visible,.deck input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.tg{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute)}
.live{border:1.5px solid var(--pink);border-radius:16px;padding:12px;display:grid;gap:8px}
#lst{font-size:13.5px;line-height:1.6;color:var(--mute)}
#lst b.ok{color:var(--lime)} #lst b.no{color:#ff9a3d}
body.ekran{padding:0;overflow:hidden}
body.ekran .phone{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;max-width:none;aspect-ratio:auto;border-radius:0;box-shadow:none}

#dokun{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(0,0,0,.84);color:#fff;font:800 24px var(--body);text-align:center;padding:24px}
#dokun small{font-size:15px;font-weight:500;color:var(--mute)}
@media (prefers-reduced-motion:reduce){.deck button{transition:none}}
</style>

<script>

 {k:"alkis",e:"GG",ad:"GG",           coin:1,  rol:"ALKIŞ",           c:"#7dff5c"},

 {k:"konf", e:"🎉",ad:"Konfeti",      coin:100,rol:"KONFETİ",         c:"#ffc83d"},
 {k:"dj",   e:"💸",ad:"Para Tabancası",coin:500,rol:"DJ OL",          c:"#ffc83d"},

/* ---------- plan (1080x2340; TikTok arayüzünden kaçan alan) ---------- */
const Z={dj:{x:500,y:735,w:80,h:10},pist:{x:280,y:860,w:520,h:360},vip:{x:870,y:870,w:150,h:330},bar:{x:880,y:1300,w:140,h:150},lobi:{x:230,y:1300,w:580,h:520}};

function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
function nokta(z){z=Z[z];return{x:R(z.x+20,z.x+z.w-20),y:R(z.y+20,z.y+z.h)}}
function kisi(ad){if(P[ad])return P[ad];const h=hash(ad);
  const p={ad,x:KAPI.x+R(-40,40),y:KAPI.y,zone:"lobi",t:nokta("lobi"),wait:0,coin:0,shirt:SHIRT[h%8],skin:SKIN[(h>>3)%5],hair:HAIR[(h>>6)%6],etek:(h>>9)%2===0,jump:0,star:false,heart:0,drink:false,ph:Math.random()*6};
  P[ad]=p;ppl.push(p);if(ppl.length>40){const o=ppl.find(q=>q.coin===0&&q.ad!==djAd);if(o){ppl.splice(ppl.indexOf(o),1);delete P[o.ad]}}return p}

/* ---------- olaylar ---------- */

function hediye(ad,i){const g=G[i],p=kisi(ad),now=performance.now();p.coin+=g.coin;p.jump=1;sac(p,g.c,14);ses.cing(Math.min(3,Math.floor(i/2)));

  case"bar":git(p,"bar");p.drink=true;duyur(`🫰 @${ad} bara geçti`,g.c,2000,0);break;
  case"sov":git(p,"pist");p.t={x:540,y:1040};sovAd=ad;sovBit=now+10000;duyur(`🧿 @${ad} DANS ŞOVUNDA`,g.c,2600,1);break;
  case"vip":git(p,"vip");duyur(`🌸 @${ad} VIP LOCADA`,g.c,2600,1);break;
  case"konf":for(let k=0;k<160;k++)parts.push({x:R(0,W),y:R(-900,-20),vx:R(-1.5,1.5),vy:R(4,8),l:1,c:rnd(SHIRT),s:R(10,18),t:"f",a:R(0,6),va:R(-.2,.2)});duyur(`🎉 @${ad} KONFETİ PATLATTI`,g.c,2800,1);break;
  case"dj":if(djAd&&P[djAd]&&djAd!==ad)git(P[djAd],"vip");djAd=ad;djBit=now+45000;git(p,"dj");strobe=now+9000;
    for(let k=0;k<110;k++)parts.push({x:R(0,W),y:R(-900,-40),vx:R(-1,1),vy:R(6,11),l:1,c:Math.random()<.7?"#3fbf6a":"#ffc83d",s:1,t:"p",a:R(0,6),va:R(-.2,.2)});
    duyur(`👑 @${ad} DJ OLDU!`,g.c,4200,2);ses.gong();break}}
function duyur(t,c,ms,lv){const now=performance.now();if(banner&&banner.lv>lv&&now<banner.bit)return;banner={t,c,bit:now+ms,bas:now,lv}}

function sahne(now){

  for(let i=0;i<16;i++){const h=20+Math.abs(Math.sin(now/200+i*.7))*(now<strobe?110:70);x.fillStyle=i%2?"#2b2266":"#3a2c80";x.fillRect(318+i*38,700-h,30,h-4)}
  if(ekranAd&&now<ekranBit){x.fillStyle="#ff7ac8";rr(320,580,600,110,14);x.fill();x.fillStyle="#0d0a1f";x.font=`700 24px ${FONT}`;x.fillText("DEV EKRANDA",620,606);
    x.font=`54px ${DISP}`;x.fillText(kes("@"+ekranAd,`54px ${DISP}`,560),620,652)}
  else{x.font=`40px ${DISP}`;x.fillStyle="#29e3ff";x.fillText(djAd?"DJ @"+kes(djAd,`40px ${DISP}`,440):"HEDİYE AT, SAHNE SENİN",620,630)}
  // DJ kabini
  x.fillStyle="#2a2160";rr(440,722,200,60,16);x.fill();x.fillStyle=djAd?"#ffc83d":"#4a3d99";rr(452,758,176,16,6);x.fill();
  // pist karoları

  for(let i=0;i<7;i++)for(let j=0;j<5;j++){const on=(i+j+beat)%3===0;x.fillStyle=on?cols[(i*7+j*3+beat)%cols.length]:"#2b2266";x.fillRect(262+i*80,846+j*80,74,74)}
  if(sovAd&&now<sovBit){x.globalAlpha=.25;x.fillStyle="#ffffff";x.beginPath();x.moveTo(500,720);x.lineTo(580,720);x.lineTo(660,1100);x.lineTo(420,1100);x.fill();x.globalAlpha=1;x.strokeStyle="#3d8bff";x.lineWidth=8;x.beginPath();x.ellipse(540,1070,110,40,0,0,7);x.stroke()}

  x.fillStyle="#241c55";rr(205,1260,640,630,28);x.fill();
  x.fillStyle="#ff3ea5";rr(450,1880,140,26,8);x.fill();x.font=`700 20px ${FONT}`;x.fillStyle="#0d0a1f";x.fillText("GİRİŞ",520,1894);
  if(str){x.globalAlpha=.16;for(let i=0;i<4;i++){const a=now/420+i*1.57;x.fillStyle=["#ffc83d","#ff3ea5","#29e3ff","#7dff5c"][i];x.beginPath();x.moveTo(540,760);x.lineTo(540+Math.cos(a)*900-120,760+Math.abs(Math.sin(a))*1000);x.lineTo(540+Math.cos(a)*900+120,760+Math.abs(Math.sin(a))*1000);x.fill()}x.globalAlpha=1}
}
function lejant(){ // sol sütun: hediye → rol
  x.fillStyle="rgba(13,10,31,.92)";rr(10,540,166,1100,24);x.fill();x.strokeStyle="#2c2452";x.lineWidth=3;x.stroke();

    x.font=`900 19px ${FONT}`;x.fillStyle="#f4f0ff";x.fillText(g.rol,93,y+44);x.font=`500 17px ${FONT}`;x.fillStyle="#a99fd0";x.fillText(g.coin+" jeton",93,y+66)})}
function cizKisi(p,now){
  x.save();x.translate(p.x,p.y);x.scale(1.45,1.45);
  const dans=p.zone==="pist"||p.zone==="dj"||now<alkisBit,s=Math.sin(now/234+p.ph),b=dans?Math.abs(s)*12:0,j=p.jump>0?Math.sin(p.jump*Math.PI)*34:0,Y=-b-j;

}
function tablo(){
  const top=ppl.filter(p=>p.coin>0).sort((a,b)=>b.coin-a.coin).slice(0,5),X=858,Y=1520;

let AC=null,muzikT=null;const on=()=>$("snd").checked;
function ac(){try{AC=AC||new AudioContext();AC.resume()}catch(e){}}
function ton(f,d,tp="sine",v=.08,dl=0){if(!AC||!on())return;const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+dl;o.type=tp;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g).connect(AC.destination);o.start(s);o.stop(s+d+.02)}
const ses={cing(g){[[660,880],[740,988],[880,1175],[988,1319]][g].forEach((f,i)=>ton(f,.35,"triangle",.07,i*.08))},gong(){[110,165,220,330].forEach((f,i)=>ton(f,2.5,"sine",.12/(i+1)));[523,659,784,1046].forEach((f,i)=>ton(f,.4,"square",.03,.1+i*.09))}};
let gurultu=null;
function muzik(){if(!AC||muzikT)return;const spb=60/124;let n=AC.currentTime+.1,s=0;
  gurultu=AC.createBuffer(1,AC.sampleRate*.2,AC.sampleRate);const d=gurultu.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const bas=[45,45,48,43],tick=()=>{if(!on()){n=AC.currentTime+.1;return}while(n<AC.currentTime+.4){const t=n,bar=Math.floor(s/4)%4;
    const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.25);
    const h=AC.createBufferSource(),hf=AC.createBiquadFilter(),hg=AC.createGain();h.buffer=gurultu;hf.type="highpass";hf.frequency.value=7000;hg.gain.setValueAtTime(.09,t+spb/2);hg.gain.exponentialRampToValueAtTime(.001,t+spb/2+.06);h.connect(hf).connect(hg).connect(AC.destination);h.start(t+spb/2);h.stop(t+spb/2+.08);
    const bo=AC.createOscillator(),bg=AC.createGain(),bf=AC.createBiquadFilter();bo.type="sawtooth";bo.frequency.value=440*Math.pow(2,(bas[bar]-69)/12);bf.type="lowpass";bf.frequency.value=420;bg.gain.setValueAtTime(.14,t+spb/2);bg.gain.exponentialRampToValueAtTime(.001,t+spb*.95);bo.connect(bf).connect(bg).connect(AC.destination);bo.start(t+spb/2);bo.stop(t+spb);
    if(s%8===0){[0,3,7].forEach(iv=>{const c=AC.createOscillator(),cg=AC.createGain();c.type="triangle";c.frequency.value=440*Math.pow(2,(bas[bar]+24+iv-69)/12);cg.gain.setValueAtTime(.035,t);cg.gain.exponentialRampToValueAtTime(.001,t+spb*1.8);c.connect(cg).connect(AC.destination);c.start(t);c.stop(t+spb*2)})}
    s++;n+=spb}};muzikT=setInterval(tick,100);tick()}

const TOPIC="kulup450de79e68d058f0";let MOD="demo",ws=null,wsOk=false,nOk=false,es=null;const gor=new Set();

function isle(e){if(!e||typeof e!=="object")return;const ad=temiz(e.ad);
  if(e.t==="gift")hediye(ad,Math.max(0,Math.min(G.length-1,e.i|0)));else if(e.t==="like")begen(ad,e.n|0);else if(e.t==="follow")takip(ad);else if(e.t==="join")katil(ad)}
let likeBuf={},likeT=0,joinBuf=new Set(),joinT=0;

function yap(e){isle(e);if(MOD!=="kumanda")return;e.id=yid();
  if(e.t==="like"){likeBuf[e.ad]=(likeBuf[e.ad]||0)+e.n;if(!likeT)likeT=setTimeout(()=>{post({t:"batch",id:yid(),l:Object.entries(likeBuf).map(([ad,n])=>({t:"like",ad,n,id:yid()}))});likeBuf={};likeT=0},12000);return}
  if(e.t==="join"){joinBuf.add(e.ad);if(!joinT)joinT=setTimeout(()=>{post({t:"batch",id:yid(),l:[...joinBuf].map(ad=>({t:"join",ad,id:yid()}))});joinBuf=new Set();joinT=0},8000);return}
  post(e)}

  es.onmessage=ev=>{try{const m=JSON.parse(ev.data);if(m.event&&m.event!=="message")return;al(JSON.parse(m.message))}catch(z){}}}

  if(n.includes("money gun")||c>=500)return 7;if(n.includes("confetti")||c>=100)return 6;if(n.includes("perfume")||c>=20)return 5;

  ws.onopen=()=>{wsOk=true;lst()};ws.onclose=()=>{wsOk=false;lst();if(MOD==="kumanda")setTimeout(tf,4000)};ws.onerror=()=>{};
  ws.onmessage=m=>{let j;try{j=JSON.parse(m.data)}catch(z){return}const d=j.data||{},ad=d.uniqueId||d.nickname;if(!ad)return;
    if(j.event==="gift"){if(d.giftType===1&&!d.repeatEnd)return;const k=Math.max(1,Math.min(3,+d.repeatCount||1)),i=seviye(d);for(let q=0;q<k;q++)setTimeout(()=>yap({t:"gift",ad,i}),q*400)}
